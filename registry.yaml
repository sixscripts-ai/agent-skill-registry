    status: active
  - name: eval-harness-architect
    tier: evaluation
    path: shared/evaluation/eval-harness-architect
    description: "Builds and runs binary evals for skills and scripts."
    trust_tier: T2
    status: active
  - name: multi-model-consensus-auditor
    tier: evaluation
    path: shared/evaluation/multi-model-consensus-auditor
    description: "Uses a separate critic provider to review high-impact changes."
    trust_tier: T3
    status: active

